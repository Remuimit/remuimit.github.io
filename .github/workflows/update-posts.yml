name: Update latest posts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch blog RSS and write posts.json
        run: |
          python3 - <<'PY'
          import email.utils
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          FEED = "https://reimu0721.xyz/feed/"
          LIMIT = 6

          req = urllib.request.Request(FEED, headers={"User-Agent": "Mozilla/5.0 (post-list-updater)"})
          raw = urllib.request.urlopen(req, timeout=60).read()
          root = ET.fromstring(raw)

          posts = []
          for item in root.iter("item"):
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              pub = (item.findtext("pubDate") or "").strip()
              date = ""
              if pub:
                  try:
                      date = email.utils.parsedate_to_datetime(pub).strftime("%Y-%m-%d")
                  except Exception:
                      date = pub[:16]
              if title and link:
                  posts.append({"title": title, "link": link, "date": date})
              if len(posts) >= LIMIT:
                  break

          if not posts:
              raise SystemExit("no posts parsed from feed")

          with open("posts.json", "w", encoding="utf-8") as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"wrote {len(posts)} posts")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --staged --quiet; then
            echo "posts.json unchanged"
          else
            git commit -m "chore: update latest posts"
            git push
          fi
